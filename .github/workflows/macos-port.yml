name: macOS app build

on:
  push:
    branches: [master, macos-port]

permissions:
  contents: write

concurrency:
  group: customizemii-macos-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: 26.0.30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare port
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/customizemii-port"
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/customizemii-port"
          cd "$RUNNER_TEMP/customizemii-port"
          dotnet tool install --global Majorsilence.Forms.Migrator --version "$PACKAGE_VERSION"
          export PATH="$PATH:$HOME/.dotnet/tools"
          majorsilence-migrate CustomizeMii.sln --no-backup
          python3 "$GITHUB_WORKSPACE/.github/workflows/patch_macos.py" "$RUNNER_TEMP/customizemii-port"
      - name: Restore
        run: dotnet restore "$RUNNER_TEMP/customizemii-port/CustomizeMii/CustomizeMii.csproj"
      - name: Build
        run: dotnet build "$RUNNER_TEMP/customizemii-port/CustomizeMii/CustomizeMii.csproj" -c Release --no-restore
      - name: Publish .app
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/customizemii-port"
          rm -rf publish app dist
          dotnet publish CustomizeMii/CustomizeMii.csproj -c Release -r osx-arm64 --self-contained true -p:UseAppHost=true -o publish
          mkdir -p app/CustomizeMii.app/Contents/MacOS app/CustomizeMii.app/Contents/Resources
          cp -a publish/. app/CustomizeMii.app/Contents/MacOS/
          chmod +x app/CustomizeMii.app/Contents/MacOS/CustomizeMii
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple Computer//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '  <key>CFBundleName</key><string>CustomizeMii</string>' \
            '  <key>CFBundleDisplayName</key><string>CustomizeMii</string>' \
            '  <key>CFBundleIdentifier</key><string>com.nvdemu.customizemii</string>' \
            '  <key>CFBundleExecutable</key><string>CustomizeMii</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            '  <key>CFBundleVersion</key><string>1.0.0</string>' \
            '  <key>CFBundleShortVersionString</key><string>1.0.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict></plist>' > app/CustomizeMii.app/Contents/Info.plist
          mkdir -p dist
          cd app
          zip -r -y "../dist/CustomizeMii-macOS-arm64.app.zip" CustomizeMii.app
          cd ..
          cp -a dist "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: CustomizeMii-macOS-arm64
          path: dist/
      - name: Create GitHub release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="macos-$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/dist/CustomizeMii-macOS-arm64.app.zip" \
            --title "CustomizeMii macOS $TAG" \
            --notes "Apple Silicon macOS build of the NVDEMU CustomizeMii fork. The ZIP contains a normal CustomizeMii.app bundle."